# Push and pull request to main: commit messages (Conventional Commits), lint, type check, unit tests (+ reports).
# Push to main only, after all checks: semantic release (tag vX.Y.Z + GitHub Release, if commits warrant one)
# and the SSR image ghcr.io/<owner>/<repo>:<commit sha> (+ :vX.Y.Z when a release was made).
# Deploy is manual: deploy/deploy.sh <sha>.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VITE_API_URL: https://api.artai.win  # baked into the browser bundle

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages
        env:
          FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # first push of a branch has no "before": lint just the pushed commit
          if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then FROM="$TO~1"; fi
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
            commitlint --from "$FROM" --to "$TO" --verbose

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run type-check
      - name: Unit tests with coverage (JUnit -> reports/junit.xml)
        run: npm run test:ci 2>&1 | tee test-output.txt  # bash -o pipefail: a test failure still fails the step
      - name: Coverage summary
        if: always()
        run: |
          { echo '### Coverage'; echo '```'; sed -n '/Coverage summary/,/^====/p' test-output.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: reports/
          retention-days: 14

  release:
    if: github.event_name == 'push'
    needs: [commits, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag + GitHub Release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}  # a branch, not a detached HEAD: semantic release needs it
          fetch-depth: 0
      - name: Release exactly the tested commit, even if main moved on meanwhile
        run: git reset --hard ${{ github.sha }}
      - id: release
        uses: python-semantic-release/python-semantic-release@v10.7.0
        with:
          config_file: releaserc.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false  # version lives in git tags, nothing is committed back to main
          tag: true
          push: true
          changelog: false
          vcs_release: true

  image:
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          build-args: VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ needs.release.outputs.released == 'true' && format('ghcr.io/{0}:v{1}', github.repository, needs.release.outputs.version) || '' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
